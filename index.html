<body class="app-shell font-body selection:bg-primary-fixed selection:text-on-primary-fixed" data-page="dashboard">
  <header class="app-topbar fixed top-0 w-full z-50 bg-[#0e0e0e] no-border tonal-shift">
    <div class="flex justify-between items-center h-16 px-6 w-full max-w-md mx-auto">
      <div class="flex items-center gap-3 active:scale-95 duration-200 cursor-pointer">
        <span class="material-symbols-outlined text-[#cafd00]" data-icon="speed" style="font-variation-settings: 'FILL' 1;">speed</span>
        <h1 class="font-headline font-bold text-white text-xl">看板</h1>
      </div>
      <button class="material-symbols-outlined text-[#adaaaa] hover:opacity-80 transition-opacity active:scale-95 duration-200" data-icon="dark_mode" id="dashboardThemeHint" type="button">dark_mode</button>
    </div>
  </header>
  <main class="app-main pt-20 pb-32 px-6 max-w-md mx-auto">
    <div class="app-page-hero mb-10 mt-4">
      <p class="font-label text-on-surface-variant tracking-widest text-[10px] uppercase mb-1">今日概览</p>
      <h2 class="font-headline text-3xl font-extrabold tracking-tight">数据看板</h2>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2 bg-surface-container rounded-lg p-6 flex flex-col justify-between min-h-[180px]">
        <div>
          <span class="font-label text-on-surface-variant text-[11px] uppercase tracking-widest">本月花费 (元)</span>
          <div class="font-headline text-[3.5rem] font-bold leading-none mt-4 tracking-tighter" id="dashboardMonthlySpend">1250.50</div>
        </div>
        <div class="flex items-center gap-2 text-primary-fixed mt-4">
          <span class="material-symbols-outlined text-sm" data-icon="trending_up">trending_up</span>
          <span class="font-label text-[10px]" id="dashboardMonthlyDelta">比上月增长 12%</span>
        </div>
      </div>
      <div class="bg-surface-container rounded-lg p-5 flex flex-col justify-between aspect-square">
        <span class="material-symbols-outlined text-secondary text-2xl" data-icon="distance">distance</span>
        <div>
          <span class="font-label text-on-surface-variant text-[10px] uppercase block mb-1">本月里程</span>
          <div class="font-headline text-2xl font-bold" id="dashboardMonthlyMileage">1420</div>
          <span class="font-label text-on-surface-variant text-[10px]" id="dashboardMileageUnit">公里</span>
        </div>
      </div>
      <div class="bg-surface-container rounded-lg p-5 flex flex-col justify-between aspect-square">
        <div class="w-full bg-surface-container-high rounded-full h-1 overflow-hidden">
          <div class="bg-primary-fixed h-full w-[65%]"></div>
        </div>
        <div>
          <span class="font-label text-on-surface-variant text-[10px] uppercase block mb-1">平均油耗</span>
          <div class="font-headline text-2xl font-bold" id="dashboardAvgEfficiency">7.2</div>
          <span class="font-label text-on-surface-variant text-[10px]">按当前显示单位换算</span>
        </div>
      </div>
    </div>
    <section class="app-dashboard-story mt-6">
      <div class="app-dashboard-story-card relative overflow-hidden rounded-lg min-h-[180px] group">
        <img alt="Travel" class="absolute inset-0 w-full h-full object-cover grayscale opacity-60 group-hover:grayscale-0 transition-all duration-700" data-alt="dramatic cinematic shot of a luxury off-road vehicle driving on a winding coastal road at sunrise with soft golden light and deep shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmkmPlYMlRxhkCxgP4nxVc6UiLt75q1tLWObW8ywqg-Fh9EbmCNhFt1RFYizEci92_sRPespR9YZaJXf0_9uBrR5Z3-8-2H9-YPhml6ZLPPzFTVk5dmVvWH833azelWkIUbgtnnzD6GRHBvn_Kd_pQ_JC3qRVMdNJ5V_ctThY-yxIXICQHQw1qAWZeOJJO8HuCTX07Yv1oC7tn2fNy2hEAWFtY79WK0VjfeF4A9vsYSwWbEijZaqufk-bQ9Zj1jKYdswtTgopy2pRj"/>
