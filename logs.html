    </section>

        <div class="flex justify-between items-end mb-4">
          <h2 class="font-headline text-on-surface font-medium text-[1.25rem]">2024年03月20日</h2>
          <span class="font-label text-on-surface-variant text-[0.75rem] font-bold tracking-wider">09:45</span>
        </div>
        <div class="bg-surface-container rounded-lg p-6 transition-all duration-300 active:scale-[0.98] active:bg-surface-container-high cursor-pointer">
          <div class="flex justify-between items-start mb-6">
            <div>
              <p class="font-label text-on-surface-variant text-[0.7rem] uppercase tracking-tighter mb-1">加油车辆</p>
              <p class="font-headline text-white font-bold text-lg">粤B*****45</p>
            </div>
            <div class="text-right">
              <p class="font-label text-on-surface-variant text-[0.7rem] uppercase tracking-tighter mb-1">实付金额</p>

            </div>
          </div>

              <p class="font-headline text-white text-[0.9rem] font-medium">8.5 L/100KM</p>
            </div>
            <div>
              <p class="font-label text-on-surface-variant text-[0.65rem] uppercase mb-1">当前里程</p>
              <p class="font-headline text-white text-[0.9rem] font-medium">45200</p>
            </div>
            <div class="text-right">
              <p class="font-label text-on-surface-variant text-[0.65rem] uppercase mb-1">加油量</p>
              <p class="font-headline text-white text-[0.9rem] font-medium">52.94 L</p>
            </div>
          </div>
        </div>
